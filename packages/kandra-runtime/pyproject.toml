[tool.poetry]
name = "kandra-runtime"
version = "0.0.1"
description = "Runtime library for SDKs generated by Kandra: transports, codecs, scanners, identity store."
authors = ["Sean Foley"]
readme = "README.md"
packages = [
    { include = "kandra_runtime", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.9"
bleak = "^3.0.2"
platformdirs = "^4.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "C90", "ANN", "D"]
ignore = ["D100", "D104", "D203", "D213", "ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
