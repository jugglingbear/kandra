[tool.poetry]
name = "kandra"
version = "0.0.1"
description = "Framework for generating typed, IP-isolated Python SDKs for embedded-Linux device control."
authors = ["Sean Foley"]
readme = "README.md"
packages = [
    { include = "kandra", from = "src" },
]
include = [
    { path = "src/kandra/scaffold/templates/**/*.jinja", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
"ruamel.yaml" = "^0.18"
jinja2 = "^3.1"
questionary = "^2.0"
# At publish time the prepare-release script rewrites this to a plain
# version constraint (e.g. ``kandra-runtime = "^0.1.0"``). During local
# development it resolves to the sibling editable install instead.
kandra-runtime = { path = "../kandra-runtime", develop = true }
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^7.1.0"

[tool.poetry.scripts]
kandra = "kandra.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "C90", "ANN", "D"]
ignore = ["D100", "D104", "D203", "D213", "ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
