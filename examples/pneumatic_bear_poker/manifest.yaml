# Example manifest for the fictional Pneumatic Bear Poker, a device that pokes bears, pneumatically. This is Kandra's
# reference example: it wires real handler/codec classes (under examples/pneumatic_bear_poker/src/) over HTTP, and
# examples/pneumatic_bear_poker/demo.py drives the full lifecycle against the simulator in
# examples/pneumatic_bear_poker/firmware_sim/. See docs/getting-started.md for a step-by-step walkthrough.

schema_version: 1

device:
  id: pneumatic_bear_poker
  display_name: Pneumatic Bear Poker
  firmware_min: "2.4.0"
  audience: [internal, partner_woodland]

source_roots:
  # Import roots, relative to this manifest. Dotted paths (handler:, codec:, adapter:) resolve against them, e.g.
  # devices.pneumatic_bear_poker.handlers.poker:Deploy is
  # examples/pneumatic_bear_poker/src/devices/pneumatic_bear_poker/handlers/poker.py
  - src

transports:
  - id: wifi   # HTTP over the device's Wi-Fi; each operation's http: block is keyed by this id
    family: http
    config: { base_url: "http://192.168.1.1:8080" }
    # HTTP may omit codec (runtime HttpJsonCodec) and adapter (runtime HttpTransport).
    # The generated SDK bakes this into http_enrollment(); the device's auth endpoint stays out of caller code
    # (credentials still injected at runtime).
    enrollment: { login_path: /v1/auth/login }

commands:
  # Extend the arm at the requested pressure (100 psi max). A no-op when already extended; rejected while powered off.
  - id: poker.deploy
    handler: devices.pneumatic_bear_poker.handlers.poker:Deploy
    transports: [wifi]
    audience: [internal, partner_woodland]
    timeout: 5.0
    idempotent: true   # deploying an already-extended arm is a no-op
    http:
      wifi:
        method: POST
        path: /v1/poker/deploy
        body_codec: json
        response_codec: json
        expects_response: true

  # Pull the arm back. A no-op when already retracted; rejected while powered off.
  - id: poker.retract
    handler: devices.pneumatic_bear_poker.handlers.poker:Retract
    transports: [wifi]
    audience: [internal, partner_woodland]
    timeout: 1.0
    idempotent: true
    retries: 2   # re-send on a transient link drop (retracting twice is a no-op)
    http:
      wifi:
        method: POST
        path: /v1/poker/retract
        body_codec: json
        response_codec: json
        expects_response: true

  # Bench testing only: extend the arm like poker.deploy, but without its 100 psi ceiling.
  - id: poker.overdrive
    handler: devices.pneumatic_bear_poker.handlers.overdrive:Overdrive
    transports: [wifi]
    # IP isolation: only the internal audience gets this command. A `--profile partner_woodland` build prunes it, and
    # its handler file, from the SDK entirely. See docs/concepts/audiences.md.
    audience: [internal]
    timeout: 5.0
    idempotent: true   # like deploy, a no-op when the arm is already extended
    http:
      wifi:
        method: POST
        path: /v1/poker/overdrive
        body_codec: json
        response_codec: json
        expects_response: true

  # Energise the compressor and bring the air rail up to standby pressure. The arm only moves while powered.
  - id: power.on
    handler: devices.pneumatic_bear_poker.handlers.power:PowerOn
    transports: [wifi]
    audience: [internal, partner_woodland]
    timeout: 10.0
    idempotent: true
    http:
      wifi:
        method: POST
        path: /v1/power/on
        body_codec: json
        response_codec: json
        expects_response: true

  # De-energise the compressor, optionally venting residual line pressure first. The arm stays where it is.
  - id: power.off
    handler: devices.pneumatic_bear_poker.handlers.power:PowerOff
    transports: [wifi]
    audience: [internal, partner_woodland]
    timeout: 10.0
    idempotent: true
    http:
      wifi:
        method: POST
        path: /v1/power/off
        body_codec: json
        response_codec: json
        # Fire-and-forget: cutting its own power rail drops the HTTP reply mid-flight, so we don't wait for an ACK
        # we'll never see.
        expects_response: false

  # Pull the device's rolling log buffer.
  - id: logs.download
    handler: devices.pneumatic_bear_poker.handlers.diagnostics:DownloadLogs
    transports: [wifi]  # BLE is too slow to send logs
    audience: [internal, partner_woodland]
    timeout: 30.0
    idempotent: true
    # Only devices that support diagnostics can run this command. See docs/concepts/capabilities.md.
    capabilities: [diagnostics]
    http:
      wifi:
        method: GET
        path: /v1/logs
        body_codec: json
        response_codec: json
        # GET with a body is legal in JSON-RPC-style APIs but messy; ask the generator to lift request fields onto the
        # query string.
        query_from_request: true
        expects_response: true

# Attributes are named device *state* (read / write), as opposed to commands (one-shot actions). The generator emits a
# namespaced sub-object: `client.settings.poke_intensity.read() / .write(v)`.
attributes:
  # How hard the arm pokes, on a 0-11 scale: read it or write it.
  - id: settings.poke_intensity
    handler: devices.pneumatic_bear_poker.handlers.settings:PokeIntensitySetting
    transports: [wifi]
    operations: [read, write]
    audience: [internal, partner_woodland]
    http:
      wifi:
        # Explicit verbs, exactly like commands: read via GET, write via PUT.
        read: { method: GET, path: /v1/settings/poke_intensity }
        write: { method: PUT, path: /v1/settings/poke_intensity, body_codec: json }

  # What the device is doing right now: power, arm position, and line pressure.
  - id: device.status
    handler: devices.pneumatic_bear_poker.handlers.status:DeviceStatus
    transports: [wifi]
    operations: [read]
    audience: [internal, partner_woodland]
    http:
      wifi:
        read: { method: GET, path: /v1/status }

vendoring:
  # extra_include takes a file, a whole directory, or a glob (relative to a source_root) -- for code or assets the
  # static import walker can't discover.
  extra_include:
    - devices/pneumatic_bear_poker/handlers/super_important.py  # dynamically imported module
    - devices/pneumatic_bear_poker/assets/  # whole directory of runtime data files
  # Internal bench tooling -- keep it out of every shipped SDK.
  exclude: [devices/pneumatic_bear_poker/handlers/super_secret.py]

# How the SDK's scan_http() finds the device on the network. See docs/concepts/scanner.md.
discovery:
  http:
    base_urls:
      - "http://192.168.1.1:8080"
      - "http://pneumatic-bear-poker.local:8080"
    probe_path: /v1/status   # device.status; answers without a login so scanning works
    server_header_prefix: "PneumaticBearPoker"   # optional: the reply's Server header must start with this
