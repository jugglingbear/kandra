# Minimal Kandra manifest for a GoPro camera.
#
# Audience: one device, one command -- shutter start/stop -- exposed over both BLE (Open GoPro Control & Query service)
# and HTTP (Open GoPro v2 REST API over Wi-Fi). This is intentionally the smallest manifest that is still wire-accurate
# against a real camera.
#
# Why two commands instead of one ``shutter`` with a boolean? Because the wire encoding genuinely differs: HTTP uses
# two distinct paths (``/shutter/start`` vs ``/shutter/stop``) and BLE uses two distinct TLV payloads
# (``\x03\x01\x01\x01`` vs ``\x03\x01\x01\x00``). Modeling them as separate commands keeps the manifest declarative;
# a thin ``def set_shutter(on: bool)`` convenience can wrap the two on the client side.

schema_version: 1

device:
  id: opengopro
  display_name: GoPro Camera
  firmware_min: "0.0.0"
  audience: [public]

source_roots:
  - src

transports:
  # --- BLE ------------------------------------------------------------------------------------------------------------
  # Open GoPro "Control & Query Service" (a.k.a. the "Wireless Control Service"). The command channel write/notify pair
  # handles set-shutter, etc.
  - id: ble
    family: ble
    codec: devices.opengopro.codecs.gopro_tlv:GoProTlv
    channels:
      command:
        write:  "b5f90072-aa8d-11e3-9046-0002a5d5c51b"   # GP-0072
        notify: "b5f90073-aa8d-11e3-9046-0002a5d5c51b"   # GP-0073

  # --- HTTP / Wi-Fi ---------------------------------------------------------------------------------------------------
  # Default station-mode IP when the camera is the AP.
  - id: http
    family: http
    config: { base_url: "http://10.5.5.9:8080" }

commands:
  - id: shutter.start
    handler: devices.opengopro.handlers.shutter:Start
    transports: [ble, http]
    audience: [public]
    timeout: 5.0
    idempotent: true   # pressing start while recording is a no-op
    http:
      http:
        method: GET
        path: /gopro/camera/shutter/start
        # Parameterless GET returning ``{}``; the custom codec sends no body and maps the empty reply to an ack.
        codec: devices.opengopro.codecs.gopro_json:GoProJson
        body_codec: none
        response_codec: json
        expects_response: true
    ble:
      ble:
        channel: command
        expects_response: true

  - id: shutter.stop
    handler: devices.opengopro.handlers.shutter:Stop
    transports: [ble, http]
    audience: [public]
    timeout: 5.0
    idempotent: true
    http:
      http:
        method: GET
        path: /gopro/camera/shutter/stop
        codec: devices.opengopro.codecs.gopro_json:GoProJson
        body_codec: none
        response_codec: json
        expects_response: true
    ble:
      ble:
        channel: command
        expects_response: true

discovery:
  ble:
    # GoPro cameras advertise as "GoPro 1234" where 1234 is the last
    # four digits of the serial. The 16-bit ``fea6`` is GoPro Inc.'s
    # assigned Bluetooth SIG service UUID -- present in every Open
    # GoPro advertisement and the most reliable filter.
    name_prefix: "GoPro "
    service_uuids:
      - "0000fea6-0000-1000-8000-00805f9b34fb"
  http:
    # When the camera is its own AP the client is at 10.5.5.100 and the
    # camera is at 10.5.5.9. When the camera is in station mode (joined
    # the user's Wi-Fi) the IP is whatever DHCP gave it -- discover via
    # mDNS or pass an override via ``scan_http(base_urls=...)``.
    base_urls:
      - "http://10.5.5.9:8080"
    probe_path: "/gopro/camera/state"
    server_header_prefix: "GoPro"
