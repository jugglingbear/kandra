name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: the Pages deployment needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      # No dependency cache: this repo git-ignores poetry.lock, so setup-python's
      # `cache: poetry` has no lockfile to key on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace + docs dependencies
        run: poetry install --with docs

      - name: Build the docs site (warnings are errors)
        run: make build-docs-strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
